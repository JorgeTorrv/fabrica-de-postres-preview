<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages caches index.html for 10 min. If a visitor loads a
      // stale copy right after a new deploy, it can reference JS/CSS files
      // that no longer exist (Vite hashes filenames per build), leaving a
      // blank page. Detect that failure and force one silent cache-busting
      // reload instead of making the visitor figure out to refresh.
      (function () {
        var KEY = 'fp-stale-reload'
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && !sessionStorage.getItem(KEY)) {
              sessionStorage.setItem(KEY, '1')
              location.reload()
            }
          },
          true,
        )
        window.addEventListener('load', function () {
          setTimeout(function () {
            sessionStorage.removeItem(KEY)
          }, 15000)
        })
      })()
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%images/logo/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fábrica de Postres — pastelería artesanal y cafetería en Lomas de Rosales, Tampico. Pasteles, cheesecakes, galletas y postres para eventos, hechos a mano." />
    <meta name="theme-color" content="#fbf4ea" />
    <title>Fábrica de Postres · Pastelería en Tampico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
